[package]
name = "ku-potato-server"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
futures-util = "0.3"
google-drive = { path = "../google-drive" }
hex = "0.4"
humantime = "2"
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-proto = { version = "0.33", default-features = false, features = [
  "gen-tonic-messages",
  "with-serde",
  "trace",
  "metrics",
  "logs",
] }
opentelemetry_sdk = "0.33"
percent-encoding = "2"
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "cookies",
  "stream",
] }
reqwest_cookie_store = "0.10"
sea-orm = { version = "2.0.4", default-features = false, features = [
  "macros",
  "runtime-tokio",
  "sqlx-sqlite",
  "sqlite-use-returning-for-3_35",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tonic = "0.14"
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "url"] }
utoipa-axum = "0.3.0"
uuid = { version = "1", features = ["v4"] }
zstd = "0.14.4"

[dev-dependencies]
jsonschema = { version = "0.62.0", default-features = false }
opentelemetry_sdk = { version = "0.33", features = ["testing"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-prost-build = "0.14"
