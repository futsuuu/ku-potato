[package]
name = "google-drive"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = "0.3"
bytes = "1"
futures-util = "0.3"
mailparse = "0.18.0"
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "cookies",
  "stream",
] }
scraper = "0.29.0"
thiserror = "2"
url = "2"

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
