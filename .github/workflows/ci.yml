name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - name: Install desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - run: vp run build
      - run: vp run test

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          install-only: true
      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - run: vp run check
