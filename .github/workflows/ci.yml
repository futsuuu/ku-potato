name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - run: vp run desktop:frontend:build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: frontend
          path: desktop/frontend/dist/client
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  check-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - run: vp run check:js
      - run: vp run format:js:check
      - run: vp run desktop:frontend:test
      - run: vp run app-server:api:docs:test

  test-go:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      WAILS_EXP_USE_WAKE: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        shell: bash
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-
      - name: Install desktop dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frontend
          path: desktop/frontend/dist/client
      - run: go build -o ./desktop/build/bin/ ./browser-worker/cmd/ku-potato-browser-worker ./user-browser/cmd/ku-potato-user-browser
      - run: go tool wails3 build --skip-frontend
      - run: go test -count=1 ./browser-worker/... ./user-browser/... ./internal/... ./desktop/...

  test-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Protobuf on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - name: Install Protobuf on macOS
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install Protobuf on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget install --id Google.Protobuf --exact --source winget --location "$env:RUNNER_TEMP\protobuf" --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\protobuf\bin" >> $env:GITHUB_PATH
          & "$env:RUNNER_TEMP\protobuf\bin\protoc.exe" --version
      - name: Install Rust
        shell: bash
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace

  check-go:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - uses: actions/download-artifact@v8.0.2
        with:
          name: frontend
          path: desktop/frontend/dist/client
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: ./...
      - run: golangci-lint fmt --diff

  check-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo fmt --all --check

  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        run: |
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ${{ steps.go-cache.outputs.mod }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.go.outputs.go-version }}-
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
      - name: Install code generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format libgtk-4-dev libwebkitgtk-6.0-dev pkg-config protobuf-compiler libprotobuf-dev
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install SeaORM CLI
        run: |
          cargo install --locked sea-orm-cli --version 2.0.4 \
            --no-default-features --features codegen,sqlx-sqlite,runtime-tokio
      - run: vp run app-server:db:check
      - run: vp run desktop:bindings:generate
      - run: vp run app-server:api:generate
      - name: Check generated sources
        run: |
          git add --intent-to-add -- app-server/openapi.json desktop/frontend/bindings
          git diff --exit-code HEAD -- app-server/openapi.json desktop/frontend/bindings
      - run: vp run format:proto:check
