receivers:
  filelog:
    include:
      - /data/*/traces.jsonl
      - /data/traces.jsonl
      - /data/*/metrics.jsonl
      - /data/metrics.jsonl
      - /data/*/logs.jsonl
      - /data/logs.jsonl
    include_file_name: false
    start_at: beginning
    max_log_size: 16MiB
    max_concurrent_files: 1
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s

connectors:
  otlp_json:

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlphttp:
    endpoint: http://lgtm:4318
    sending_queue:
      block_on_overflow: true
      num_consumers: 1
      queue_size: 2
    retry_on_failure:
      max_elapsed_time: 0s

service:
  pipelines:
    logs/file:
      receivers: [filelog]
      processors: [memory_limiter]
      exporters: [otlp_json]
    traces:
      receivers: [otlp_json]
      processors: [batch]
      exporters: [otlphttp]
    metrics:
      receivers: [otlp_json]
      processors: [batch]
      exporters: [otlphttp]
    logs:
      receivers: [otlp_json]
      processors: [batch]
      exporters: [otlphttp]
